[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tweaker"
version = "0.1.0"
description = "Drop-in open-source Seer service for self-hosted Sentry"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Tweaker contributors" }]
keywords = ["sentry", "debugging", "ai", "observability", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "anthropic>=1.0.0,<2",
  "arq>=0.26.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "redis>=5.0.0",
  "pyjwt>=2.8.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
postgres = ["psycopg[binary]>=3.2.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.22.0",
  "ruff>=0.8.0",
]
all = ["tweaker[mcp,postgres,dev]"]

[project.scripts]
tweaker = "tweaker.cli:main"
tweaker-worker = "tweaker.worker:main"
tweaker-mcp = "tweaker.mcp_server:main"

[project.urls]
Homepage = "https://github.com/tweaker/tweaker"
Documentation = "https://github.com/tweaker/tweaker/tree/main/docs"
Issues = "https://github.com/tweaker/tweaker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tweaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["tweaker"]

[tool.mypy]
python_version = "3.12"
packages = ["tweaker"]
ignore_missing_imports = true
